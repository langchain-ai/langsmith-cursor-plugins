name: Test SEA auto-update

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sea-update-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-update:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: darwin
            arch: arm64
            executable_ext: ""
            old_version: 0.0.1
            new_version: 0.0.2
            release_api: http://127.0.0.1:43119/releases/latest
          - runner: windows-2025
            platform: win32
            arch: x64
            executable_ext: .exe
            old_version: 0.0.1
            new_version: 0.0.2
            release_api: http://127.0.0.1:43119/releases/latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: pnpm install --frozen-lockfile

      - name: Build old signed and notarized SEA
        if: ${{ matrix.platform == 'darwin' }}
        run: pnpm build:sea
        env:
          LANGSMITH_CURSOR_INTERNAL_VERSION: ${{ matrix.old_version }}
          LANGSMITH_CURSOR_INTERNAL_RELEASE_API: ${{ matrix.release_api }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build old unsigned SEA
        if: ${{ matrix.platform == 'win32' }}
        run: pnpm build:sea
        env:
          LANGSMITH_CURSOR_INTERNAL_VERSION: ${{ matrix.old_version }}
          LANGSMITH_CURSOR_INTERNAL_RELEASE_API: ${{ matrix.release_api }}

      - name: Build new signed and notarized SEA
        if: ${{ matrix.platform == 'darwin' }}
        run: pnpm build:sea
        env:
          LANGSMITH_CURSOR_INTERNAL_VERSION: ${{ matrix.new_version }}
          LANGSMITH_CURSOR_INTERNAL_RELEASE_API: ${{ matrix.release_api }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build new unsigned SEA
        if: ${{ matrix.platform == 'win32' }}
        run: pnpm build:sea
        env:
          LANGSMITH_CURSOR_INTERNAL_VERSION: ${{ matrix.new_version }}
          LANGSMITH_CURSOR_INTERNAL_RELEASE_API: ${{ matrix.release_api }}

      - name: Exercise Stop-hook auto-update
        run: >-
          node scripts/test-sea-update.mjs
          --old-archive dist/langsmith-cursor-tracing-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.old_version }}.zip
          --new-binary dist/langsmith-cursor-tracing-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.new_version }}${{ matrix.executable_ext }}
          --old-version ${{ matrix.old_version }}
          --new-version ${{ matrix.new_version }}
          --release-api ${{ matrix.release_api }}
