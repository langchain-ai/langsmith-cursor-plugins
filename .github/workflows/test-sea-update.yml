name: Test SEA auto-update

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sea-update-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-update:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-arm
            platform: darwin
            arch: arm64
            old_version: 0.0.1
            new_version: 0.0.2
            release_api: http://127.0.0.1:43119/releases/latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.7.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - run: pnpm install --frozen-lockfile

      - name: Build, sign, and notarize old SEA
        run: pnpm build:sea
        env:
          LANGSMITH_CURSOR_INTERNAL_VERSION: ${{ matrix.old_version }}
          LANGSMITH_CURSOR_INTERNAL_RELEASE_API: ${{ matrix.release_api }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build, sign, and notarize new SEA
        run: pnpm build:sea
        env:
          LANGSMITH_CURSOR_INTERNAL_VERSION: ${{ matrix.new_version }}
          LANGSMITH_CURSOR_INTERNAL_RELEASE_API: ${{ matrix.release_api }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Exercise Stop-hook auto-update
        run: >-
          node scripts/test-sea-update.mjs
          --old-archive dist/langsmith-cursor-tracing-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.old_version }}.zip
          --new-binary dist/langsmith-cursor-tracing-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.new_version }}
          --old-version ${{ matrix.old_version }}
          --new-version ${{ matrix.new_version }}
          --release-api ${{ matrix.release_api }}
