name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: this workflow only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # Below the plugin's minimum, so the guard's unsupported-Node tests run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: echo "CURSOR_PLUGIN_TEST_OLD_NODE=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build first: the guard tests run the bundle, so they must see this diff.
      - run: pnpm build
      - run: pnpm test
      # Last, so a stale committed bundle does not hide the test results.
      - name: Check bundle is up to date
        run: |
          git diff --exit-code bundle/ || {
            echo "::error::bundle/ is out of date. Run 'pnpm build' and commit the result."
            exit 1
          }
