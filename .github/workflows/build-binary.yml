name: Build Binary

on:
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - langsmith-tracing/.cursor-plugin/plugin.json
      - .github/workflows/build-binary.yml
      - binary.config.json
      - langsmith-tracing/binary/**
      - macos-entitlements.plist
      - package.json
      - pnpm-lock.yaml
      - src/**
      - test/binary.test.ts

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@4f00ccd18d7892db480b5c4210628e97b4aa4a47 # v0.4.7
    secrets: inherit
    with:
      bun-version: 1.4.4
      binary-directory: langsmith-tracing/binary
