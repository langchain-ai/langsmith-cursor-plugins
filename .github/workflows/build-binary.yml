name: Build Binary

on:
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - langsmith-tracing/.cursor-plugin/plugin.json
      - .github/workflows/build-binary.yml
      - binary.config.json
      - langsmith-tracing/binary/**
      - macos-entitlements.plist
      - package.json
      - pnpm-lock.yaml
      - src/**
      - test/binary.test.ts

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@564729bc6c84f7256970babbf072e50bb3f56875 # v0.6.3
    secrets: inherit
    with:
      bun-version: 1.4.4
      binary-directory: langsmith-tracing/binary
