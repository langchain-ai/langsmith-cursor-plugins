name: Build Binary

on:
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .cursor-plugin/plugin.json
      - .github/workflows/build-binary.yml
      - binary.config.json
      - binary/**
      - macos-entitlements.plist
      - package.json
      - pnpm-lock.yaml
      - src/**
      - test/binary.test.ts

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@bbee665375e2df6e89b88ae19a14df54fb705fcb # langchain-ai/langsmith-plugin-binary#104
    secrets: inherit
