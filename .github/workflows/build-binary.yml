name: Build Binary

on:
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .cursor-plugin/plugin.json
      - .github/workflows/build-binary.yml
      - binary.config.json
      - binary/**
      - macos-entitlements.plist
      - package.json
      - pnpm-lock.yaml
      - src/**
      - test/binary.test.ts

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@741cb4f5e3278a62c8002d8771d61b6d4a3d1e11 # v0.4.7
    secrets: inherit
    with:
      bun-version: 1.4.4
