name: Build SEA

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-sea:
    runs-on: macos-26-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.7.0
          architecture: arm64
          cache: pnpm
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - run: pnpm install --frozen-lockfile
      - name: Build signed and notarized artifact
        run: pnpm build:sea
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Upload signed SEA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: langsmith-cursor-tracing-darwin-arm64
          path: dist/langsmith-cursor-tracing-darwin-arm64-*
          if-no-files-found: error

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build-sea
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SEA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langsmith-cursor-tracing-darwin-arm64
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/langsmith-cursor-tracing-darwin-arm64-* \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/langsmith-cursor-tracing-darwin-arm64-* \
              --verify-tag \
              --generate-notes
          fi
