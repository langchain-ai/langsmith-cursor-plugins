name: Build SEA

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-sea:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          architecture: arm64
          cache: pnpm
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned artifact for PR validation
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm build:sea
        env:
          LANGSMITH_CURSOR_UNSIGNED_BUILD: "true"
      - name: Build signed and notarized artifact
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm build:sea
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Upload signed SEA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-cursor-tracing-darwin-arm64
          path: dist/langsmith-cursor-tracing-darwin-arm64-*
          if-no-files-found: error

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build-sea
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SEA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langsmith-cursor-tracing-darwin-arm64
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/langsmith-cursor-tracing-darwin-arm64-* \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/langsmith-cursor-tracing-darwin-arm64-* \
              --verify-tag \
              --generate-notes
          fi
